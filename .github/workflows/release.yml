# Builds the desktop app for every platform and attaches the installers to a
# GitHub Release. Windows and macOS installers cannot be produced from Linux,
# so each one is built on its own runner.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a draft release as well as building
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the renderer
        run: npm run build

      - name: Build the single-file edition
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:single

      - name: Package the desktop app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && 'always' || 'never' }}

      - uses: actions/upload-artifact@v4
        with:
          name: jsrf-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.yml
            game/JetSetRadioFuture.html
          if-no-files-found: warn
